<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话脉络</title><link rel="stylesheet" href="panel.css"></head>
<body><header><div class="top"><b>对话脉络</b><label class="auto-label"><input id="automatic" type="checkbox" checked>自动读取</label></div><select id="archive" aria-label="已采集的对话"><option value="">选择本机对话记录</option></select><div class="ai-toolbar"><button id="extract" class="primary" disabled>抽取关系图</button><button id="cancelExtract" hidden>取消抽取</button><button id="settingsButton">设置</button></div><div class="tabs" role="tablist" aria-label="视图"><button id="timelineTab" role="tab" aria-selected="true">时间线列表</button><button id="graphTab" role="tab" aria-selected="false">关系图</button></div></header>
<p id="aiState" class="organize-status" role="status" aria-live="polite"></p><p id="status" role="alert" hidden></p><main><section id="timeline" aria-label="时间线列表"></section><section id="graph" aria-label="关系图" hidden></section></main>
<footer><span>Topic Atlas · v0.7.11</span><div><button id="export" disabled>导出 JSON</button><button id="delete" disabled>删除此记录</button><button id="diagnose">复制采集诊断</button></div><pre id="diagnostic" hidden></pre></footer>
<dialog id="editor"><form id="editForm"><h2>编辑主题</h2><label>主题名称<input id="topicInput" maxlength="80" placeholder="相同名称会合并成同一主题" list="topicNames"><datalist id="topicNames"></datalist></label><label>本轮补充总结<textarea id="summaryInput" rows="3" maxlength="1000" placeholder="写下这一轮讨论的核心内容"></textarea></label><label>与上一主题的关系<select id="relationInput"><option value="">自动：推进 / 同主题再次出现</option><option value="flow">推进</option><option value="branch">分支</option><option value="return">回归</option></select></label><p>人工标注会优先保留。修改后请重新抽取，以更新 AI 关系图。</p><div class="actions"><button type="button" id="cancelEdit">取消</button><button type="submit">保存</button></div></form></dialog>



<script src="core.js"></script><script src="prompt.js"></script><script src="ai.js"></script><script src="panel-state.js"></script><script src="graph-view.js"></script><script src="panel.js"></script></body></html>
